  - name: modbusCoilReadout
    description: |-
      This will create a single-bit readout (discrete input / coil)
    parameters:
      P:
        type: str
        description: Device Prefix
      R:
        type: str
        description: Device Suffix
      PORT:
        type: str
        description: Port name for the detector
      DESC:
        type: str
        description: |-
          Readout description
        default: Value
      OFFSET:
        type: int
        description: |-
          Bit OFFSET within the modbus port
      SCAN:
        type: str
        description: |-
          Scan Mode
        default: I/O Intr
      ZNAM:
        type: str
        description: |-
          Zero name (state string for value 0)
        default: "Off"
      ONAM:
        type: str
        description: |-
          One name (state string for value 1)
        default: "On"
      ZSV:
        type: str
        description: |-
          Zero severity
        default: NO_ALARM
      OSV:
        type: str
        description: |-
          One severity
        default: NO_ALARM

    databases:
      - file: $(SUPPORT)/modbus/db/bi_bit.template
        args:
          P:
          R:
          PORT:
          OFFSET:
          DESC:
          SCAN:
          ZNAM:
          ONAM:
          ZSV:
          OSV:

  - name: modbusCoilWrite
