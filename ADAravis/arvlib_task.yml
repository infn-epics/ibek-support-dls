- name: Build aravis vendor library
  ansible.builtin.shell:
    cmd: |
      setopt -e
      git clone -b "0.8.35" --depth 1 https://github.com/AravisProject/aravis
      cd aravis
      # INFN: don't report "control lost" when heartbeat reads go unanswered,
      # only when the camera answers that we have no control (false positives
      # left ADAravis Disconnected until an IOC restart)
      git apply "{{ ibek_support_folder }}/patches/aravis-0.8.35-heartbeat-no-false-control-lost.patch" || exit 1
      meson build
      cd build
      ninja
      ninja install
      rm -fr /usr/local/aravis
      echo /usr/local/lib64 > /etc/ld.so.conf.d/usr.conf
      cd
      ldconfig
    executable: /bin/bash
    chdir: /usr/local
